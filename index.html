<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GoBite UG</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#FEF9F0;padding-bottom:80px}
.top{background:#0B4D2E;color:#fff;padding:12px;text-align:center;font-weight:800;position:sticky;top:0;z-index:20}
.card{background:#fff;padding:12px;border-radius:12px;margin:10px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.btn{width:100%;padding:12px;background:#0B4D2E;color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;margin:6px 0}
input{width:100%;padding:11px;margin:6px 0;border-radius:9px;border:1px solid #ccc}

/* === ONLY CHANGE - GRID LIKE SCREENSHOT 1 === */
#restaurantsList{
  display:grid !important;
  grid-template-columns:1fr 1fr !important;
  gap:10px !important;
  padding:10px !important;
}
.rest-card{
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  cursor:pointer;
  border:1px solid #eee;
}
.rest-card img{width:100%;height:115px;object-fit:cover;display:block;background:#ddd}
.rest-card .r-name{padding:8px;text-align:center;font-weight:700;font-size:13px;background:#FFFDF5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="top">GoBite UG</div>

<div style="padding:10px">
  <div id="restaurantsList">Loading restaurants...</div>
</div>

<div id="restaurantPage" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#FEF9F0;z-index:50;overflow:auto">
  <div class="top"><span onclick="closeRestaurant()" style="cursor:pointer">← Back</span> <span id="restNameTitle"></span></div>
  <div id="menuItems"></div>
</div>

<div id="cartPage" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:60;overflow:auto;padding:12px">
  <h3>Cart</h3><div id="cartItems"></div>
  <input id="custName" placeholder="Your Name"><input id="custPhone" placeholder="Phone"><input id="custAddress" placeholder="Address">
  <button class="btn" onclick="placeOrder()">Place Order</button>
  <button class="btn" style="background:#eee;color:#333" onclick="closeCart()">Close</button>
</div>

<div style="position:fixed;bottom:0;left:0;right:0;background:#0B4D2E;color:#fff;padding:12px;display:flex;justify-content:space-between;z-index:30" id="cartBar" onclick="openCart()">
  <span id="cartText">Cart: 0 items</span><b>View Cart</b>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getFirestore, collection, query, where, onSnapshot, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyD03wRNk-iF3_0esTdYPEn4zzCGyjyYK88",authDomain:"gobite-ug.firebaseapp.com",projectId:"gobite-ug",storageBucket:"gobite-ug.firebasestorage.app",messagingSenderId:"479330891516",appId:"1:479330891516:web:dff4620fc3344a45b3c979"};
const app=initializeApp(firebaseConfig); const db=getFirestore(app);
let allRests=[], currentRest=null, cart=[];

onSnapshot(query(collection(db,'restaurants'), where('status','==','approved')), snap=>{
  allRests=[]; snap.forEach(d=>allRests.push({id:d.id,...d.data()}));
  const box=document.getElementById('restaurantsList');
  box.innerHTML=allRests.map(r=>{
    const cover=r.coverUrl||r.logoUrl||'https://via.placeholder.com/300x115';
    return `<div class="rest-card" onclick="openRestaurant('${r.id}')"><img src="${cover}"><div class="r-name">${r.name}</div></div>`;
  }).join('');
});

window.openRestaurant=async(id)=>{
  currentRest=allRests.find(r=>r.id===id);
  document.getElementById('restaurantPage').style.display='block';
  document.getElementById('restNameTitle').innerText=currentRest.name;
  const snap=await getDocs(collection(db,'restaurants',id,'menu'));
  let html=''; snap.forEach(d=>{ const m=d.data(); html+=`<div class="card" style="display:flex;justify-content:space-between"><div><b>${m.name}</b><br><small>${m.category||''}</small><br>UGX ${m.price}</div><button class="btn" style="width:auto;padding:8px 14px" onclick="addToCart('${d.id}','${m.name}',${m.price})">+</button></div>`; });
  document.getElementById('menuItems').innerHTML=html||'No menu';
};
window.closeRestaurant=()=>document.getElementById('restaurantPage').style.display='none';
window.addToCart=(id,name,price)=>{ cart.push({id,name,price,qty:1,restId:currentRest.id,restName:currentRest.name}); updateCart(); };
function updateCart(){ document.getElementById('cartText').innerText=`Cart: ${cart.length} items`; document.getElementById('cartItems').innerHTML=cart.map(c=>`<div>${c.name} - UGX ${c.price}</div>`).join(''); }
window.openCart=()=>document.getElementById('cartPage').style.display='block';
window.closeCart=()=>document.getElementById('cartPage').style.display='none';
window.placeOrder=async()=>{
  const total=cart.reduce((s,c)=>s+c.price,0);
  await addDoc(collection(db,'orders'),{restId:currentRest.id,restName:currentRest.name,customerName:custName.value,customerPhone:custPhone.value,customerAddress:custAddress.value,items:cart,total,status:'new',createdAt:serverTimestamp()});
  alert('Order placed!'); cart=[]; updateCart(); closeCart(); closeRestaurant();
};
</script>
</body>
</html>
