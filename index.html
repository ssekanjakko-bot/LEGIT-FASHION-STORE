<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoBite UG - Food Delivery in Kampala</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <header class="navbar">
    <h1 class="logo">GoBite</h1>
    <button class="cart-btn">🛒 Cart <span>0</span></button>
  </header>

  <section class="search-section">
    <input type="text" placeholder="Search restaurants or food in Kampala">
  </section>

  <section class="categories">
    <h2>Categories</h2>
    <div class="category-list">
      <div class="category">🍔 Burgers</div>
      <div class="category">🍛 Rice</div>
      <div class="category">🍗 Chicken</div>
      <div class="category">🥤 Drinks</div>
    </div>
  </section>

  <section class="restaurants">
    <h2>Popular Near You</h2>
    <div id="restaurant-list">
      
      <div class="restaurant-card">
        <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=200" alt="Nandos">
        <div class="info">
          <h3>Nandos Wandegeya</h3>
          <div class="meta">⭐ 4.5 • 25-35 min • UGX 3,000 delivery</div>
        </div>
        <div class="arrow">→</div>
      </div>

      <div class="restaurant-card">
        <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=200" alt="Bubus">
        <div class="info">
          <h3>Bubus Restaurant</h3>
          <div class="meta">⭐ 4.7 • 30-40 min • UGX 4,000 delivery</div>
        </div>
        <div class="arrow">→</div>
      </div>

      <div class="restaurant-card">
        <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=200" alt="KFC">
        <div class="info">
          <h3>KFC Acacia Mall</h3>
          <div class="meta">⭐ 4.3 • 20-30 min • UGX 3,500 delivery</div>
        </div>
        <div class="arrow">→</div>
      </div>

    </div>
  </section>

  <footer>© 2026 GoBite UG. Food delivery in Kampala.</footer>

</body>
</html>
