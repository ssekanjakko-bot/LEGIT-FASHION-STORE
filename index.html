<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoBite UG</title>
<style>
*{box-sizing:border-box;font-family:Arial;margin:0}body{background:#FEF9F0;max-width:500px;margin:auto;padding-bottom:80px}
.top{background:#0B4D2E;color:#fff;padding:12px 15px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}
.hero{height:160px;background:url('https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=600') center/cover;position:relative;display:flex;align-items:center;justify-content:center}
.hero::after{content:'';position:absolute;inset:0;background:rgba(0,0,0,.5)} .hero h1{position:relative;color:#fff;text-align:center;z-index:1;font-size:21px}
.gps{background:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-size:12px;box-shadow:0 2px 5px rgba(0,0,0,.05)}
.btn-gps{background:#0B4D2E;color:#fff;border:none;padding:6px 12px;border-radius:20px;font-weight:700}
.card{background:#fff;border-radius:14px;overflow:hidden;margin:10px;box-shadow:0 2px 10px rgba(0,0,0,.07);cursor:pointer}
.card img{width:100%;height:130px;object-fit:cover;background:#eee} .info{padding:10px} .meta{font-size:11px;color:#666;display:flex;gap:8px}
.dist{color:#0B4D2E;font-weight:700}
</style>
</head>
<body>
<div class="top"><h3>GoBite <span style="color:#FFD700">UG</span></h3><span onclick="location.href='cart.html'">🛒 <b id="cCount">0</b></span></div>
<div class="hero"><h1>Order from your<br>favorite restaurants!</h1></div>
<div class="gps"><span id="gpsT">📍 Locating you...</span><button class="btn-gps" onclick="getLoc()">Enable GPS</button></div>
<div style="padding:10px"><h3 style="text-align:center">Select Restaurant</h3><div id="list">Loading approved...</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyD03wRNk-iF3_0esTdYPEn4zzCGyjyYK88",authDomain:"gobite-ug.firebaseapp.com",projectId:"gobite-ug",storageBucket:"gobite-ug.firebasestorage.app",messagingSenderId:"479330891516",appId:"1:479330891516:web:dff4620fc3344a45b3c979"};
const app=initializeApp(firebaseConfig); const db=getFirestore(app);
let uLat=null,uLng=null; let cart=JSON.parse(localStorage.getItem('gobite_cart')||'[]'); document.getElementById('cCount').innerText=cart.length;

window.getLoc=()=>{ navigator.geolocation.getCurrentPosition(p=>{uLat=p.coords.latitude;uLng=p.coords.longitude;document.getElementById('gpsT').innerText=`📍 Near ${uLat.toFixed(3)},${uLng.toFixed(3)}`;load();},()=>load()); };
async function load(){
  const snap=await getDocs(query(collection(db,'restaurants'),where('status','==','approved')));
  let rests=[]; snap.forEach(d=>rests.push({id:d.id,...d.data()}));
  rests.forEach(r=>{ r.dist = uLat ? calc(uLat,uLng,r.lat,r.lng) : 9999; }); rests.sort((a,b)=>a.dist-b.dist);
  const list=document.getElementById('list');
  if(rests.length==0){ list.innerHTML='<p style="text-align:center;color:#888;padding:20px">No approved restaurants.<br>Admin must approve in admin774.html</p>'; return; }
  list.innerHTML='';
  rests.forEach(r=>{
    const d=document.createElement('div'); d.className='card'; d.onclick=()=>location.href=`restaurant.html?id=${r.id}`;
    d.innerHTML=`<img src="${r.coverUrl||r.logoUrl||'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=500'}"><div class="info"><b>${r.name}</b><div class="meta"><span>${r.cuisine||'Restaurant'}</span><span class="dist">${r.dist<9999?r.dist.toFixed(1)+'km away':'View Menu'}</span></div><div style="font-size:11px;color:#999">${r.address||''}</div></div>`;
    list.appendChild(d);
  });
}
function calc(a,b,c,d){ const R=6371, dLat=(c-a)*Math.PI/180, dLon=(d-b)*Math.PI/180, x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2; return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)); }
getLoc();
</script>
</body>
</html>
