<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodHub Admin Panel</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:20px}
.container{max-width:900px;margin:auto;background:white;padding:20px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
h1{color:#FF6B35}
.card{border:1px solid #ddd;padding:15px;border-radius:10px;margin-bottom:15px}
.card img{width:60px;height:60px;object-fit:cover;border-radius:8px;margin-right:10px}
.btn{padding:8px 15px;border:none;border-radius:6px;cursor:pointer;font-weight:bold;margin-right:5px}
.approve{background:#28a745;color:white}
.reject{background:#dc3545;color:white}
.pending{color:orange;font-weight:bold}
.approved{color:green;font-weight:bold}
</style>
</head>
<body>
<div class="container">
  <h1>🔥 FoodHub Admin Panel</h1>
  <div id="restaurantList">Loading...</div>
</div>

<script type="module">
import { db } from './firebase.js';
import { collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

loadRestaurants();

async function loadRestaurants(){
  const list = document.getElementById('restaurantList');
  list.innerHTML = 'Loading...';
  const snap = await getDocs(collection(db, 'restaurants'));
  list.innerHTML = '';
  if(snap.empty){ list.innerHTML = '<p>No restaurants yet. Go save one in partner774.html first</p>'; return; }
  
  snap.forEach(docSnap => {
    const r = docSnap.data();
    const statusClass = r.status === 'approved' ? 'approved' : 'pending';
    list.innerHTML += `
    <div class="card">
      <div style="display:flex;align-items:center">
        <img src="${r.logoUrl || 'https://via.placeholder.com/60'}" />
        <div>
          <h4 style="margin:0">${r.name}</h4>
          <p style="margin:0">${r.cuisine} - ${r.phone}</p>
          <p style="margin:0" class="${statusClass}">Status: ${r.status}</p>
        </div>
      </div>
      <div style="margin-top:10px">
        ${r.status !== 'approved' ? `<button class="btn approve" onclick="approveRestaurant('${docSnap.id}')">Approve</button>` : ''}
        <button class="btn reject" onclick="rejectRestaurant('${docSnap.id}')">Reject</button>
      </div>
    </div>
    `;
  });
}

window.approveRestaurant = async function(id){
  await updateDoc(doc(db, 'restaurants', id), {status: 'approved'});
  alert('Restaurant Approved!');
  loadRestaurants();
}

window.rejectRestaurant = async function(id){
  await updateDoc(doc(db, 'restaurants', id), {status: 'rejected'});
  alert('Restaurant Rejected');
  loadRestaurants();
}
</script>
</body>
</html>
