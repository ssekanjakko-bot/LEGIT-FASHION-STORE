<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoBite UG - Restaurants Near You</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="navbar">
    <h1 class="logo">GoBite</h1>
    <button class="cart-btn">🛒 <span id="cart-count">0</span></button>
  </header>

  <!-- SEARCH + LOCATION -->
  <section class="search-section">
    <div class="location-bar">
      <span id="location-text">📍 Getting your location...</span>
    </div>
    <input type="text" id="searchInput" placeholder="Search restaurants or food" onkeyup="filterRestaurants()">
  </section>

  <!-- RESTAURANT LISTINGS -->
  <section class="restaurants">
    <h2>Restaurants Near You</h2>
    <div id="restaurant-list">
      <!-- Cards will be injected by JS -->
    </div>
    <p id="no-results" style="display:none; text-align:center; padding:40px;">No restaurants found 😔</p>
  </section>

  <footer>
    <p>© 2026 GoBite UG. Food delivery in Kampala.</p>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
