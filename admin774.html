<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoBite Admin - Monitor Posts</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{background:#f2f2f2;margin:0 auto;max-width:900px}
.top{background:#0B4D2E;color:#fff;padding:14px;text-align:center;font-weight:700}
.tabs{display:flex;gap:5px;margin:10px} .tab{flex:1;padding:10px;border:none;border-radius:8px;cursor:pointer;background:#ddd;font-weight:700} .tab.active{background:#0B4D2E;color:#fff}
.box{background:#fff;margin:10px;padding:12px;border-radius:12px}
.card{border:1px solid #eee;border-radius:12px;padding:10px;margin:10px 0;display:flex;gap:10px}
.card img{width:70px;height:70px;object-fit:cover;border-radius:8px;background:#eee}
.btn{padding:6px 10px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700;margin-right:4px}
.approve{background:#0B4D2E;color:#fff}.reject{background:#dc3545;color:#fff}.view{background:#eee}
.badge{padding:3px 6px;border-radius:5px;font-size:10px;font-weight:700} .pending{background:#fff3cd} .approved{background:#d4edda}
.menu-item{font-size:12px;padding:5px 0;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="top">GoBite Admin - See All Posts + Approve</div>
<div class="tabs">
<button id="tPending" class="tab active" onclick="setTab('pending')">⏳ Pending (<span id="cP">0</span>)</button>
<button id="tApproved" class="tab" onclick="setTab('approved')">✅ Approved (<span id="cA">0</span>)</button>
<button id="tAll" class="tab" onclick="setTab('all')">All Restaurants</button>
</div>
<div class="box"><div id="list">Loading...</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyD03wRNk-iF3_0esTdYPEn4zzCGyjyYK88",authDomain:"gobite-ug.firebaseapp.com",projectId:"gobite-ug",storageBucket:"gobite-ug.firebasestorage.app",messagingSenderId:"479330891516",appId:"1:479330891516:web:dff4620fc3344a45b3c979"};
const app=initializeApp(firebaseConfig); const db=getFirestore(app);
let all=[]; let tab='pending';

async function load(){
  const snap=await getDocs(collection(db,'restaurants'));
  all=[]; snap.forEach(d=>all.push({id:d.id,...d.data()}));
  all.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
  document.getElementById('cP').innerText=all.filter(r=>r.status==='pending').length;
  document.getElementById('cA').innerText=all.filter(r=>r.status==='approved').length;
  render();
}
function render(){
  const list=document.getElementById('list');
  let filtered=all; if(tab==='pending') filtered=all.filter(r=>r.status==='pending'); if(tab==='approved') filtered=all.filter(r=>r.status==='approved');
  if(!filtered.length){ list.innerHTML='<p style="text-align:center;color:#888">No restaurants</p>'; return; }
  list.innerHTML='';
  filtered.forEach(r=>{
    const div=document.createElement('div'); div.className='card';
    div.innerHTML=`
      <img src="${r.coverUrl||r.logoUrl||'https://via.placeholder.com/70'}">
      <div style="flex:1">
        <div style="display:flex;justify-content:space-between"><b>${r.name}</b><span class="badge ${r.status}">${r.status}</span></div>
        <div style="font-size:11px;color:#666">${r.ownerEmail} | ${r.phone} | ${r.cuisine}<br>📍 ${r.address||''} - ${r.lat?.toFixed(4)},${r.lng?.toFixed(4)}</div>
        <div style="margin-top:6px">
          ${r.status==='pending'?`<button class="btn approve" onclick="approve('${r.id}')">✅ Approve</button>`:''}
          ${r.status==='approved'?`<button class="btn reject" onclick="makePending('${r.id}')">Unapprove</button><a href="restaurant.html?id=${r.id}" target="_blank"><button class="btn view">View Live</button></a>`:''}
          <button class="btn view" onclick="toggleMenu('${r.id}')">See What They Posted</button>
          <button class="btn view" style="color:red" onclick="del('${r.id}')">Delete</button>
        </div>
        <div id="menu-${r.id}" style="display:none;margin-top:8px;background:#fafafa;padding:8px;border-radius:8px"></div>
      </div>`;
    list.appendChild(div);
  });
}
window.setTab=t=>{ tab=t; document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); document.getElementById('t'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('active'); render(); };
window.approve=async id=>{ await updateDoc(doc(db,'restaurants',id),{status:'approved',approvedAt:new Date()}); alert('Approved - now shows on index.html'); load(); };
window.makePending=async id=>{ await updateDoc(doc(db,'restaurants',id),{status:'pending'}); load(); };
window.del=async id=>{ if(!confirm('Delete permanently?'))return; await deleteDoc(doc(db,'restaurants',id)); load(); };
window.toggleMenu=async id=>{
  const el=document.getElementById('menu-'+id);
  if(el.style.display==='none'){
    el.style.display='block'; el.innerHTML='Loading posts...';
    const snap=await getDocs(collection(db,'restaurants',id,'menu'));
    if(snap.empty){ el.innerHTML='<i>Restaurant has not posted any foods yet</i>'; return; }
    let html=`<b>What they posted (${snap.size} items):</b><br>`;
    snap.forEach(d=>{ const m=d.data(); html+=`<div class="menu-item"><span>${m.name} - UGX ${m.price}</span><button onclick="delItem('${id}','${d.id}')" style="border:none;background:#ffdddd;padding:3px 6px;border-radius:4px;cursor:pointer">Delete</button></div>`; });
    el.innerHTML=html;
  }else{ el.style.display='none'; }
};
window.delItem=async(restId,itemId)=>{ if(!confirm('Delete this food post?'))return; await deleteDoc(doc(db,'restaurants',restId,'menu',itemId)); alert('Deleted'); document.getElementById('menu-'+restId).style.display='none'; };
load(); setInterval(load,15000);
</script>
</body>
</html>
