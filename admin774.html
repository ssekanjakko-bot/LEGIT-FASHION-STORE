<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodHub Admin Panel</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:20px}
.container{max-width:900px;margin:auto;background:white;padding:20px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
h1{color:#FF6B35}
.card{border:1px solid #ddd;padding:15px;border-radius:10px;margin-bottom:15px}
.card img{width:60px;height:60px;object-fit:cover;border-radius:8px;margin-right:10px}
.btn{padding:8px 15px;border:none;border-radius:6px;cursor:pointer;font-weight:bold;margin-right:5px}
.approve{background:#28a745;color:white}
.reject{background:#dc3545;color:white}
.pending{color:orange;font-weight:bold}
.approved{color:green;font-weight:bold}
#loginBox{display:none}
</style>
</head>
<body>
<div class="container">
  <h1>🔥  GOBITE-UG Admin Panel</h1>
  <div id="loginBox">
    <h3>Admin Login</h3>
    <input id="adminKey" placeholder="Enter Admin Key" type="password">
    <button onclick="adminLogin()" class="btn approve">Login</button>
  </div>

  <div id="dashboard" style="display:none;">
    <h3>Pending Restaurants</h3>
    <div id="restaurantList">Loading...</div>
  </div>
</div>

<script>
// YOUR FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "PASTE_YOUR_AUTH_DOMAIN",
  projectId: "PASTE_YOUR_PROJECT_ID",
  storageBucket: "PASTE_YOUR_STORAGE_BUCKET",
  messagingSenderId: "PASTE_YOUR_SENDER_ID",
  appId: "PASTE_YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const ADMIN_KEY = "admin2026"; // change this

function adminLogin(){
  if(document.getElementById('adminKey').value === ADMIN_KEY){
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadRestaurants();
  } else { alert('Wrong key') }
}

// Show login first
document.getElementById('loginBox').style.display = 'block';

async function loadRestaurants(){
  const list = document.getElementById('restaurantList');
  list.innerHTML = 'Loading...';
  const snap = await db.collection('restaurants').get();
  list.innerHTML = '';
  if(snap.empty){ list.innerHTML = 'No restaurants yet'; return; }
  
  snap.forEach(doc => {
    const r = doc.data();
    const statusClass = r.status === 'approved' ? 'approved' : 'pending';
    list.innerHTML += `
    <div class="card">
      <div style="display:flex;align-items:center">
        <img src="${r.logoUrl || 'https://via.placeholder.com/60'}" />
        <div>
          <h4 style="margin:0">${r.name}</h4>
          <p style="margin:0">${r.cuisine} - ${r.phone}</p>
          <p style="margin:0" class="${statusClass}">Status: ${r.status}</p>
        </div>
      </div>
      <div style="margin-top:10px">
        <button class="btn approve" onclick="updateStatus('${doc.id}', 'approved')">Approve</button>
        <button class="btn reject" onclick="updateStatus('${doc.id}', 'rejected')">Reject</button>
      </div>
    </div>
    `;
  });
}

async function updateStatus(id, status){
  await db.collection('restaurants').doc(id).update({status: status});
  alert('Restaurant ' + status);
  loadRestaurants();
}
</script>
</body>
</html>
