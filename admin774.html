<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow"> <!-- Hide from Google -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - GoBite</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
 .admin-wrap { max-width: 1000px; margin: 0 auto; padding: 20px; }
 .stat-card { background: white; padding: 16px; border-radius: 14px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
 .stat-card h3 { font-size: 28px; color: var(--green); }
 .admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin-bottom: 20px; }
 .admin-table { width: 100%; background: white; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
 .admin-table th { background: var(--green); color: white; padding: 14px; text-align: left; }
 .admin-table td { padding: 14px; border-bottom: 1px solid #eee; }
 .status-new { background: #ffeb3b; padding: 4px 10px; border-radius: 20px; font-weight: 700; font-size: 12px; }
 .status-accepted { background: var(--green); color: white; padding: 4px 10px; border-radius: 20px; font-weight: 700; font-size: 12px; }
 .blocked { text-align: center; padding: 100px 20px; color: #888; }
  </style>
</head>
<body style="background:var(--bg);">

  <!-- BLOCKED SCREEN -->
  <div id="blocked-screen" class="blocked" style="display:none;">
    <h1>404</h1>
    <p>Page Not Found</p>
  </div>

  <!-- ADMIN CONTENT -->
  <div id="admin-content" style="display:none;">
    <header class="navbar">
      <button class="back-btn" onclick="window.location='index.html'">←</button>
      <h1 class="logo">GoBite Admin</h1>
      <button class="cart-btn" onclick="logout()">Logout</button>
    </header>

    <div class="admin-wrap">
      <!-- LOGIN -->
      <div id="login-box" class="admin-section">
        <h2>Admin Login</h2>
        <p style="color:#888; font-size:13px; margin-bottom:12px;">Hint: Password is `admin123`</p>
        <input type="password" id="admin-pass" placeholder="Enter Admin Password" style="width:100%; padding:14px; border:1px solid #ddd; border-radius:12px; margin-bottom:12px;">
        <button class="btn-primary" onclick="login()">Login</button>
      </div>

      <!-- DASHBOARD -->
      <div id="dashboard" style="display:none;">
        <h2 style="margin:20px 0;">Dashboard</h2>

        <div class="admin-grid">
          <div class="stat-card">
            <p>New Orders</p>
            <h3 id="order-count">0</h3>
          </div>
          <div class="stat-card">
            <p>Total Restaurants</p>
            <h3 id="rest-count">2</h3>
          </div>
          <div class="stat-card">
            <p>Total Menu Items</p>
            <h3 id="item-count">0</h3>
          </div>
        </div>

        <div class="admin-section">
          <h2>🔔 Incoming Orders</h2>
          <div id="orders-list">No orders yet</div>
        </div>

        <div class="admin-section">
          <h2>All Restaurants & Menu</h2>
          <table class="admin-table">
            <thead><tr><th>Restaurant</th><th>Category</th><th>Item</th><th>Price</th></tr></thead>
            <tbody id="menu-list-admin"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/admin.js"></script>
  <script>
    // SECRET KEY CHECK - THIS MAKES IT HIDDEN
    const SECRET_KEY = "gobiteboss2026";
    const params = new URLSearchParams(window.location.search);
    if(params.get('key') === SECRET_KEY) {
      document.getElementById('admin-content').style.display = 'block';
    } else {
      document.getElementById('blocked-screen').style.display = 'block';
    }
  </script>
</body>
</html>
