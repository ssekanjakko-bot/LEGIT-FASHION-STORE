<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoBite Admin - Approval Panel</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{background:#f5f5f5;margin:0 auto;max-width:800px}
.top{background:#0B4D2E;color:#fff;padding:14px;text-align:center;font-weight:700}
.box{background:#fff;margin:10px;padding:15px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.card{border:1px solid #eee;border-radius:12px;padding:12px;margin:10px 0;display:flex;gap:12px}
.card img{width:80px;height:80px;object-fit:cover;border-radius:8px;background:#eee}
.badge{padding:4px 8px;border-radius:6px;font-size:11px;font-weight:700}
.pending{background:#fff3cd;color:#856404}.approved{background:#d4edda;color:#155724}.rejected{background:#f8d7da;color:#721c24}
.btn{padding:8px 12px;border:none;border-radius:8px;font-weight:700;cursor:pointer;margin-right:5px}
.btn-approve{background:#0B4D2E;color:#fff}.btn-reject{background:#dc3545;color:#fff}.btn-view{background:#eee}
.hidden{display:none}
.tabs{display:flex;gap:5px;margin:10px} .tab{flex:1;padding:10px;border:none;border-radius:8px;cursor:pointer;background:#ddd;font-weight:700} .tab.active{background:#0B4D2E;color:#fff}
</style>
</head>
<body>
<div class="top">GoBite UG - Admin Panel (Linked to Partner)</div>

<div class="tabs">
<button id="tabPending" class="tab active" onclick="showTab('pending')">⏳ Pending (<span id="cPending">0</span>)</button>
<button id="tabApproved" class="tab" onclick="showTab('approved')">✅ Approved (<span id="cApproved">0</span>)</button>
<button id="tabAll" class="tab" onclick="showTab('all')">All</button>
</div>

<div class="box">
<div style="display:flex;justify-content:space-between;align-items:center">
<h3 id="tabTitle">Pending Approvals</h3>
<button class="btn btn-view" onclick="loadRestaurants()">🔄 Refresh</button>
</div>
<div id="list">Loading restaurants from Firebase...</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD03wRNk-iF3_0esTdYPEn4zzCGyjyYK88",
  authDomain: "gobite-ug.firebaseapp.com",
  projectId: "gobite-ug",
  storageBucket: "gobite-ug.firebasestorage.app",
  messagingSenderId: "479330891516",
  appId: "1:479330891516:web:dff4620fc3344a45b3c979",
  measurementId: "G-90RHYD791R"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allRestaurants = [];
let currentTab = 'pending';

async function loadRestaurants(){
  const listEl = document.getElementById('list');
  listEl.innerHTML = 'Loading...';
  try{
    // Get ALL restaurants - same collection partner774 uses
    const snap = await getDocs(collection(db,'restaurants'));
    allRestaurants = [];
    snap.forEach(d=>{ allRestaurants.push({id:d.id, ...d.data()}); });
    
    // Sort newest first
    allRestaurants.sort((a,b)=> (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));

    const pending = allRestaurants.filter(r=>r.status==='pending').length;
    const approved = allRestaurants.filter(r=>r.status==='approved').length;
    document.getElementById('cPending').innerText=pending;
    document.getElementById('cApproved').innerText=approved;

    renderList();
    console.log('Loaded', allRestaurants.length, 'restaurants', allRestaurants);
  }catch(e){
    listEl.innerHTML = `<div style="color:red">Error: ${e.message}<br>Check Firestore rules - must allow read for admin</div>`;
    console.error(e);
  }
}

function renderList(){
  const listEl = document.getElementById('list');
  let filtered = allRestaurants;
  if(currentTab==='pending') filtered = allRestaurants.filter(r=>r.status==='pending');
  if(currentTab==='approved') filtered = allRestaurants.filter(r=>r.status==='approved');

  document.getElementById('tabTitle').innerText = currentTab==='pending' ? 'Pending Approvals' : currentTab==='approved' ? 'Approved Restaurants (Showing on index.html)' : 'All Restaurants';

  if(filtered.length===0){
    listEl.innerHTML = `<p style="text-align:center;color:#888;padding:20px">No ${currentTab} restaurants found.<br><small>Partner must submit in partner774.html - collection: restaurants</small></p>`;
    return;
  }

  listEl.innerHTML='';
  filtered.forEach(r=>{
    const div = document.createElement('div');
    div.className='card';
    div.innerHTML=`
      <img src="${r.coverUrl||r.logoUrl||'https://via.placeholder.com/80?text=No+Image'}" onerror="this.src='https://via.placeholder.com/80'">
      <div style="flex:1">
        <div style="display:flex;justify-content:space-between">
          <b>${r.name||'Unnamed'}</b>
          <span class="badge ${r.status}">${r.status}</span>
        </div>
        <div style="font-size:12px;color:#666;margin:4px 0">
          📧 ${r.ownerEmail||r.email||'no email'}<br>
          📞 ${r.phone||''} | 🍽️ ${r.cuisine||''}<br>
          📍 ${r.address||''} | GPS: ${r.lat||0}, ${r.lng||0}<br>
          🆔 ${r.id}
        </div>
        <div style="margin-top:8px">
          ${r.status==='pending' ? `
            <button class="btn btn-approve" onclick="approve('${r.id}')">✅ Approve - Show on Index</button>
            <button class="btn btn-reject" onclick="reject('${r.id}')">❌ Reject</button>
          ` : ''}
          ${r.status==='approved' ? `
            <button class="btn btn-reject" onclick="reject('${r.id}')">Make Pending</button>
          ` : ''}
          <button class="btn btn-view" onclick="viewMenu('${r.id}')">View Menu</button>
          <button class="btn btn-view" style="color:red" onclick="removeRest('${r.id}')">Delete</button>
        </div>
        <div id="menu-${r.id}" style="margin-top:10px;font-size:12px"></div>
      </div>
    `;
    listEl.appendChild(div);
  });
}

window.showTab = (tab)=>{
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab'+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.add('active');
  renderList();
};

window.approve = async(id)=>{
  if(!confirm('Approve this restaurant? It will show on index.html for all users near its GPS')) return;
  try{
    await updateDoc(doc(db,'restaurants',id),{status:'approved', approvedAt: new Date()});
    alert('✅ Approved! Now it will show on index.html');
    loadRestaurants();
  }catch(e){ alert('Approve failed: '+e.message); }
};

window.reject = async(id)=>{
  try{
    await updateDoc(doc(db,'restaurants',id),{status:'pending'});
    alert('Moved to pending');
    loadRestaurants();
  }catch(e){ alert(e.message); }
};

window.removeRest = async(id)=>{
  if(!confirm('DELETE this restaurant permanently?')) return;
  await deleteDoc(doc(db,'restaurants',id));
  loadRestaurants();
};

window.viewMenu = async(id)=>{
  const el=document.getElementById('menu-'+id);
  el.innerHTML='Loading menu...';
  const snap=await getDocs(collection(db,'restaurants',id,'menu'));
  if(snap.empty){ el.innerHTML='<i>No menu items yet - partner needs to upload in partner774 after approval</i>'; return; }
  let html='<b>Menu:</b><br>';
  snap.forEach(d=>{ html+=`• ${d.data().name} - UGX ${d.data().price}<br>`; });
  el.innerHTML=html;
};

loadRestaurants();
// Auto refresh every 15 seconds so you see new partners instantly
setInterval(loadRestaurants,15000);
</script>
</body>
</html>
