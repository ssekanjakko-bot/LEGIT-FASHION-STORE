<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoBite Partner - FIXED</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{background:#FEF9F0;margin:0;max-width:500px;margin:auto}
.topbar{background:#0B4D2E;color:white;padding:15px;text-align:center;font-weight:700}
.container{background:white;margin:15px;padding:20px;border-radius:16px;box-shadow:0 4px 15px rgba(0,0,0,.08)}
input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-weight:700;cursor:pointer;margin-top:10px}
.btn-orange{background:#FF6B35;color:white}.btn-green{background:#0B4D2E;color:white}.btn-grey{background:#eee;width:auto;padding:8px 15px}
.hidden{display:none}#authMsg{background:#ffe0e0;padding:10px;border-radius:8px;color:#b00;font-size:13px;margin-top:10px;display:none}
</style>
</head>
<body>
<div class="topbar">GoBite UG - Partner Portal [DEBUG]</div>
<div class="container">
<h3 id="title">Login or Create Account</h3>
<p id="userEmail" style="font-size:12px"></p>
<button id="logoutBtn" class="btn-grey hidden" onclick="logout()">Logout</button>

<div id="authDiv">
<input type="email" id="email" placeholder="Email" value="">
<input type="password" id="password" placeholder="Password min 6 chars">
<button class="btn btn-orange" onclick="signup()">Sign Up New Account</button>
<button class="btn btn-green" onclick="login()">Login Existing Account</button>
<div id="authMsg"></div>
<p style="font-size:11px;color:#666;margin-top:10px">Open console: On iPhone Safari tap AA > Web Inspector to see error. Or tell me what shows in red box.</p>
</div>

<div id="profileDiv" class="hidden">
<h4>Register Restaurant</h4>
<input id="rName" placeholder="Restaurant Name *"><input id="rPhone" placeholder="Phone *"><input id="rLat" placeholder="Lat"><input id="rLng" placeholder="Lng">
<button class="btn btn-grey" onclick="useLoc()" style="width:100%">📍 Use My Location</button>
<input type="file" id="rLogo"><input type="file" id="rCover">
<button class="btn btn-orange" onclick="createRest()">Submit for Approval</button>
<p id="pMsg"></p>
</div>

<div id="pendingDiv" class="hidden"><h3>⏳ Pending Approval - Check admin774.html</h3><p id="pName"></p></div>
<div id="menuDiv" class="hidden"><h3>✅ Approved - <span id="aName"></span></h3><input id="iName" placeholder="Food"><input id="iPrice" type="number" placeholder="Price"><button class="btn btn-green" onclick="addItem()">Upload</button><div id="list"></div></div>
</div>

<script type="module">
import { db, storage } from './firebase.js';
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { doc, setDoc, getDoc, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-storage.js";

const auth = getAuth();
let curUser=null, curId=null;
const msgBox = document.getElementById('authMsg');
function showErr(m){ msgBox.style.display='block'; msgBox.innerText='❌ ERROR: '+m; alert('ERROR: '+m); console.error(m); }

onAuthStateChanged(auth, async u=>{
  if(u){
    curUser=u; document.getElementById('authDiv').classList.add('hidden'); document.getElementById('logoutBtn').classList.remove('hidden');
    document.getElementById('userEmail').innerText=u.email; document.getElementById('title').innerText='Dashboard';
    const snap=await getDoc(doc(db,'restaurants',u.uid));
    if(!snap.exists()){ document.getElementById('profileDiv').classList.remove('hidden'); }
    else{
      const d=snap.data(); curId=u.uid;
      if(d.status!=='approved'){ document.getElementById('pendingDiv').classList.remove('hidden'); document.getElementById('pName').innerText=d.name+' status:'+d.status; }
      else{ document.getElementById('menuDiv').classList.remove('hidden'); document.getElementById('aName').innerText=d.name; loadMenu(); }
    }
  }
});

window.signup = async()=>{
  const e=document.getElementById('email').value.trim(); const p=document.getElementById('password').value.trim();
  msgBox.style.display='none';
  if(p.length<6) return showErr('Password must be at least 6 characters');
  try{ console.log('Trying signup',e); const r=await createUserWithEmailAndPassword(auth,e,p); console.log('Signup OK',r.user.uid); }
  catch(err){ showErr(err.code+' : '+err.message); }
}
window.login = async()=>{
  const e=document.getElementById('email').value.trim(); const p=document.getElementById('password').value.trim();
  msgBox.style.display='none';
  try{ await signInWithEmailAndPassword(auth,e,p); }
  catch(err){ showErr(err.code+' : '+err.message); }
}
window.logout = async()=>{ await signOut(auth); location.reload(); }
window.useLoc = ()=>{ navigator.geolocation.getCurrentPosition(pos=>{ document.getElementById('rLat').value=pos.coords.latitude; document.getElementById('rLng').value=pos.coords.longitude; }, ()=>showErr('Enable GPS location')); }

window.createRest = async()=>{
  try{
    const name=document.getElementById('rName').value; const phone=document.getElementById('rPhone').value;
    const lat=document.getElementById('rLat').value; const lng=document.getElementById('rLng').value;
    if(!name||!phone) return alert('Name & Phone needed');
    if(!lat) return alert('Click Use My Location');
    let logoUrl='', coverUrl='';
    const lf=document.getElementById('rLogo').files[0]; if(lf){ const r=ref(storage,`restaurants/${curUser.uid}/logo.jpg`); await uploadBytes(r,lf); logoUrl=await getDownloadURL(r); }
    const cf=document.getElementById('rCover').files[0]; if(cf){ const r=ref(storage,`restaurants/${curUser.uid}/cover.jpg`); await uploadBytes(r,cf); coverUrl=await getDownloadURL(r); }
    await setDoc(doc(db,'restaurants',curUser.uid),{name,phone,lat:Number(lat),lng:Number(lng),logoUrl,coverUrl,status:'pending',ownerId:curUser.uid,email:curUser.email,createdAt:new Date()});
    alert('Submitted!'); location.reload();
  }catch(e){ showErr(e.message); }
}
window.addItem = async()=>{ try{ const n=document.getElementById('iName').value; const pr=document.getElementById('iPrice').value; await addDoc(collection(db,'restaurants',curId,'menu'),{name:n,price:Number(pr),createdAt:new Date()}); alert('Added'); loadMenu(); }catch(e){showErr(e.message)} }
async function loadMenu(){ const s=await getDocs(collection(db,'restaurants',curId,'menu')); const l=document.getElementById('list'); l.innerHTML=''; s.forEach(d=>{l.innerHTML+=`<div>${d.data().name} - ${d.data().price}</div>`}) }
</script>
</body>
</html>
