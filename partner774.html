<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GoBite UG - Partner Portal</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{max-width:520px;margin:auto;background:#FEF9F0;padding:0 10px 100px}
.top{background:#0B4D2E;color:#fff;padding:14px;text-align:center;font-weight:800;position:sticky;top:0;z-index:20}
.card{background:#fff;padding:12px;border-radius:12px;margin:10px 0;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.btn{width:100%;padding:12px;background:#0B4D2E;color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;margin:6px 0;display:block;text-align:center;text-decoration:none}
.btn-red{background:#d33}.btn-gray{background:#eee;color:#333}.btn-orange{background:#FF6B35}
.tabs{display:flex;gap:6px;overflow:auto;margin:10px 0}.tab{padding:9px 14px;border-radius:20px;border:1px solid #0B4D2E;background:#fff;cursor:pointer;white-space:nowrap;font-size:13px;font-weight:600}
.tab.active{background:#0B4D2E;color:#fff}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:13px;gap:8px}
.msg{background:#FFF8E1;padding:10px 35px 10px 10px;border-radius:10px;margin:6px 0;border-left:4px solid #FF9800;position:relative}
.badge{background:#FF6B35;color:#fff;padding:2px 8px;border-radius:10px;font-size:11px}
input,select{width:100%;padding:11px;margin:6px 0;border-radius:9px;border:1px solid #ccc;font-size:14px}
label{font-size:12px;font-weight:800;margin-top:8px;display:block}
</style>
</head>
<body>
<div class="top">GoBite UG - Partner Portal</div>

<div id="loginBox" class="card" style="margin-top:30px;text-align:center">
  <h2 style="margin:0">Partner Login</h2><p style="font-size:12px;color:#666">Login to see your orders</p>
  <input id="loginEmail" type="email" placeholder="Email"><input id="loginPass" type="password" placeholder="Password">
  <button class="btn" id="loginBtn" onclick="doLogin()">🔑 Login</button><div id="loginMsg" style="font-size:12px;color:red;margin-top:8px"></div>
</div>

<div id="mainPortal" style="display:none">
  <div style="padding:8px 2px;display:flex;justify-content:space-between"><span id="userEmail" style="font-size:11px;color:#666"></span><button onclick="logout()" style="border:none;background:#eee;padding:6px 12px;border-radius:7px;font-size:12px">Logout</button></div>
  <div id="statusBox" class="card"><h3 id="restStatus" style="margin:0">Checking...</h3><div id="restInfo" style="font-size:12px;color:#666;margin-top:4px"></div></div>
  <div id="adminBox" class="card" style="border:2px solid #FF9800;display:none"><h4 style="margin:0 0 8px 0;display:flex;justify-content:space-between">📩 Messages from Admin <span id="msgCount" class="badge">0</span></h4><div id="adminMsgs"></div></div>

  <div class="tabs" id="mainTabs">
    <button class="tab active" id="oTab" onclick="showTab('orders')">📦 Orders (<span id="oCount">0</span>)</button>
    <button class="tab" id="mTab" onclick="showTab('menu')">🍔 My Menu</button>
    <button class="tab" id="pTab" onclick="showTab('profile')">⚙️ Profile</button>
  </div>

  <div class="tabs" id="orderFilter">
    <button class="tab active" onclick="filterOrders('all', this)">📜 History</button>
    <button class="tab" onclick="filterOrders('new', this)">🆕 New</button>
    <button class="tab" onclick="filterOrders('accepted', this)">✅ Accepted</button>
    <button class="tab" onclick="filterOrders('completed', this)">✔️ Completed</button>
  </div>

  <div id="ordersList"></div>

  <div id="menuList" style="display:none">
    <div class="card">
      <h3 style="margin:0 0 8px 0">🍔 Add Menu Item</h3>
      <input id="itemName" placeholder="Item name e.g Shawrama">
      <select id="itemCategory">
        <option value="">-- Select Category --</option>
        <option value="Shawarma">Shawarma</option>
        <option value="Chicken">Chicken</option>
        <option value="Fast Food">Fast Food</option>
        <option value="Local Food">Local Food</option>
        <option value="Burgers">Burgers</option>
        <option value="Pizza">Pizza</option>
        <option value="Drinks">Drinks</option>
        <option value="Breakfast">Breakfast</option>
        <option value="Snacks">Snacks</option>
      </select>
      <input id="itemPrice" type="number" placeholder="Price UGX">
      <input id="itemDesc" placeholder="Description">
      <label>Food Image</label><input type="file" id="itemImageFile" accept="image/*">
      <img id="itemPrev" style="width:100%;height:120px;object-fit:cover;border-radius:8px;display:none;margin-top:6px;background:#eee">
      <button class="btn" id="addItemBtn" onclick="addMenuItem()">➕ Add to Menu</button><div id="itemStatus" style="font-size:11px;color:green"></div>
    </div>
    <div id="myMenuItems"></div>
  </div>

  <div id="profileBox" style="display:none">
    <div class="card"><h3 style="margin-top:0">🏪 Restaurant Profile</h3>
      <input id="pName" placeholder="Restaurant Name"><input id="pPhone" placeholder="Phone 07...">
      <label>Restaurant Category</label>
      <select id="pCategory">
        <option value="">-- Select Category --</option>
        <option value="Fast Food">Fast Food</option>
        <option value="Chicken">Chicken</option>
        <option value="Shawarma">Shawarma</option>
        <option value="Local Food">Local Food</option>
        <option value="Restaurant">Restaurant</option>
        <option value="Bakery">Bakery</option>
        <option value="Drinks">Drinks</option>
      </select>
      <input id="pArea" placeholder="Area e.g Wakiso">
      <label>Logo (circle)</label><img id="logoPrev" style="width:80px;height:80px;border-radius:50%;object-fit:cover;background:#eee;display:none;border:2px solid #0B4D2E"><input type="file" id="logoFile" accept="image/*">
      <label>Cover Image</label><img id="coverPrev" style="width:100%;height:110px;border-radius:10px;object-fit:cover;background:#eee;display:none"><input type="file" id="coverFile" accept="image/*">
      <button class="btn btn-gray" onclick="getGPS()">📍 Get My GPS</button><div id="gpsText" style="font-size:12px;color:#666">📍 Not set</div>
      <button class="btn" id="saveBtn" onclick="saveProfile()">💾 Save Restaurant</button><div id="saveStatus" style="font-size:11px;color:green;margin-top:6px"></div>
    </div>
  </div>
</div>

<audio id="ding" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getFirestore, collection, doc, query, where, onSnapshot, updateDoc, deleteDoc, addDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-storage.js";
const firebaseConfig={apiKey:"AIzaSyD03wRNk-iF3_0esTdYPEn4zzCGyjyYK88",authDomain:"gobite-ug.firebaseapp.com",projectId:"gobite-ug",storageBucket:"gobite-ug.firebasestorage.app",messagingSenderId:"479330891516",appId:"1:479330891516:web:dff4620fc3344a45b3c979"};
const app=initializeApp(firebaseConfig); const db=getFirestore(app); const auth=getAuth(app); const storage=getStorage(app);
let curUser=null, allOrders=[], curFilter='all', unsubOrders=null, unsubMsgs=null, newLogoUrl=null, newCoverUrl=null, currentLat=null, currentLng=null, newItemImageUrl=null;

window.doLogin=async()=>{ const email=loginEmail.value.trim(); const pass=loginPass.value.trim(); if(!email||!pass){ loginMsg.innerText='Enter email & password'; return; } loginBtn.innerText='⏳ Logging in...'; loginBtn.disabled=true; try{ await signInWithEmailAndPassword(auth,email,pass); }catch(e){ loginMsg.innerText='❌ '+e.message; loginBtn.innerText='🔑 Login'; loginBtn.disabled=false; } };
onAuthStateChanged(auth, async(u)=>{ if(!u){ loginBox.style.display='block'; mainPortal.style.display='none'; return; } curUser=u; loginBox.style.display='none'; mainPortal.style.display='block'; userEmail.innerText=u.email; const snap=await getDoc(doc(db,'restaurants',u.uid)); if(!snap.exists()){ restStatus.innerText='❌ No restaurant'; return; } const r=snap.data(); restStatus.innerHTML=`✅ ${r.name} - ${r.status}`; restInfo.innerText=`${r.category||''} | ${r.area||''}`; pName.value=r.name||''; pPhone.value=r.phone||''; pCategory.value=r.category||''; pArea.value=r.area||''; gpsText.innerText=r.lat?`📍 ${r.lat}, ${r.lng}`:'📍 Not set'; if(r.logoUrl){ logoPrev.src=r.logoUrl; logoPrev.style.display='block'; } if(r.coverUrl){ coverPrev.src=r.coverUrl; coverPrev.style.display='block'; } if(r.lat){ currentLat=r.lat; currentLng=r.lng; } saveStatus.innerText='Status: '+r.status; listenOrders(); listenAdminMsgs(); listenMyMenu(); });

function listenAdminMsgs(){ if(unsubMsgs) unsubMsgs(); unsubMsgs=onSnapshot(collection(db,'restaurants',curUser.uid,'adminMessages'),(snap)=>{ const box=document.getElementById('adminBox'); const list=document.getElementById('adminMsgs'); const count=document.getElementById('msgCount'); if(snap.empty){ box.style.display='none'; return; } box.style.display='block'; count.innerText=snap.size; let html=''; snap.forEach(d=>{ const m={id:d.id,...d.data()}; const date=m.createdAt?.toDate?.()?.toLocaleString()||''; html+=`<div class="msg"><b>${m.from||'Admin'}:</b> ${m.text}<br><small>${date}</small><button onclick="dismissMsg('${m.id}')" style="position:absolute;top:6px;right:6px;border:none;background:#d33;color:#fff;border-radius:50%;width:24px;height:24px;font-weight:900;cursor:pointer">×</button></div>`; }); list.innerHTML=html; }); }
window.dismissMsg=async(id)=>{ if(!confirm('Delete?')) return; await deleteDoc(doc(db,'restaurants',curUser.uid,'adminMessages',id)); };
function listenOrders(){ if(unsubOrders) unsubOrders(); const q=query(collection(db,'orders'), where('restId','==',curUser.uid)); unsubOrders=onSnapshot(q, async(snap)=>{ const hadNew=snap.docChanges().some(c=>c.type==='added' && c.doc.data().status==='new'); allOrders=[]; snap.forEach(d=>allOrders.push({id:d.id,...d.data()})); allOrders.sort((a,b)=>{ const at=a.createdAt?.toMillis?.()||0; const bt=b.createdAt?.toMillis?.()||0; return bt-at; }); oCount.innerText=allOrders.filter(o=>o.status==='new').length; allOrders.forEach(async o=>{ if(o.status==='rejected'){ const age=Date.now()-(o.updatedAt?.toMillis?.()||o.createdAt?.toMillis?.()||0); if(age>5*60*1000) await deleteDoc(doc(db,'orders',o.id)).catch(()=>{}); } }); if(hadNew){ document.getElementById('ding').play().catch(()=>{}); } renderOrders(); }); }
function renderOrders(){ let list=[]; if(curFilter==='all'){ list=allOrders.filter(o=>['accepted','ready','completed'].includes(o.status)); }else{ list=allOrders.filter(o=>o.status===curFilter); } if(list.length===0){ ordersList.innerHTML=`<div class="card" style="text-align:center;color:#888;padding:20px">${curFilter==='all'?'📜 No history yet<br><small>Only Accepted & Completed</small>':`No ${curFilter} orders`}</div>`; return; } ordersList.innerHTML=list.map(o=>{ const itemsHtml=(o.items||[]).map(i=>`<div class="item"><span style="display:flex;align-items:center;gap:7px"><img src="${i.imageUrl||''}" style="width:38px;height:38px;border-radius:7px;object-fit:cover;background:#eee"> ${i.name} x${i.qty} ${i.category?`(${i.category})`:''}</span><span>UGX ${(i.price*i.qty).toLocaleString()}</span></div>`).join(''); const tel=(o.customerPhone||'').replace(/\s/g,''); const waTel=tel.startsWith('0')?'256'+tel.slice(1):tel; return `<div class="card" style="border-left:4px solid ${o.status==='new'?'#FF6B35':o.status==='completed'?'#4CAF50':'#0B4D2E'}"><div style="display:flex;justify-content:space-between"><b>#${o.orderNumber||o.id.slice(-6).toUpperCase()}</b><span class="badge" style="background:${o.status==='new'?'#FF6B35':o.status==='completed'?'#4CAF50':'#0B4D2E'}">${o.status.toUpperCase()}</span></div><div style="font-size:12px;margin:6px 0">👤 ${o.customerName}<br>📞 ${o.customerPhone}<br>📍 ${o.customerAddress}</div><div style="background:#f9f9f9;padding:6px;border-radius:9px">${itemsHtml}<div style="text-align:right;font-weight:800;margin-top:6px">Total: UGX ${(o.total||0).toLocaleString()}</div></div><div style="display:flex;gap:6px;margin-top:10px">${o.status==='new'?`<button class="btn" style="flex:1" onclick="updateOrder('${o.id}','accepted')">✅ Accept</button><button class="btn btn-red" style="flex:1" onclick="updateOrder('${o.id}','rejected')">❌ Reject</button>`:o.status==='accepted'?`<button class="btn btn-orange" style="flex:1" onclick="updateOrder('${o.id}','ready')">🍳 Ready</button><button class="btn" style="flex:1" onclick="updateOrder('${o.id}','completed')">✅ Completed</button>`:o.status==='ready'?`<button class="btn" style="flex:1" onclick="updateOrder('${o.id}','completed')">✅ Completed</button>`:`<div style="flex:1;text-align:center;color:#4CAF50;font-weight:700">✅ In History</div>`}</div><a href="tel:${tel}" class="btn btn-gray" style="background:#E8F5E9;color:#0B4D2E;font-weight:800;margin-top:6px">📞 Call Customer</a><a href="https://wa.me/${waTel}" target="_blank" class="btn" style="background:#25D366">💬 WhatsApp</a>${o.status!=='new'?`<button onclick="deleteOrder('${o.id}')" style="width:100%;border:none;background:none;color:#999;font-size:11px;margin-top:4px">🗑️ Remove from history</button>`:''}</div>`; }).join(''); }
window.filterOrders=(f,btn)=>{ curFilter=f; document.querySelectorAll('#orderFilter.tab').forEach(b=>b.classList.remove('active')); if(btn) btn.classList.add('active'); renderOrders(); }
window.updateOrder=async(id,status)=>{ await updateDoc(doc(db,'orders',id),{status, updatedAt:serverTimestamp()}); }
window.deleteOrder=async(id)=>{ if(!confirm('Delete?')) return; await deleteDoc(doc(db,'orders',id)); }
logoFile.addEventListener('change', async(e)=>{ const file=e.target.files[0]; if(!file) return; logoPrev.style.display='block'; logoPrev.src=URL.createObjectURL(file); saveBtn.innerText='⏳ Uploading logo...'; saveBtn.disabled=true; const r=ref(storage,`restaurants/${curUser.uid}/logo_${Date.now()}_${file.name}`); await uploadBytes(r,file); newLogoUrl=await getDownloadURL(r); saveBtn.innerText='💾 Save Restaurant'; saveBtn.disabled=false; });
coverFile.addEventListener('change', async(e)=>{ const file=e.target.files[0]; if(!file) return; coverPrev.style.display='block'; coverPrev.src=URL.createObjectURL(file); saveBtn.innerText='⏳ Uploading cover...'; saveBtn.disabled=true; const r=ref(storage,`restaurants/${curUser.uid}/cover_${Date.now()}_${file.name}`); await uploadBytes(r,file); newCoverUrl=await getDownloadURL(r); saveBtn.innerText='💾 Save Restaurant'; saveBtn.disabled=false; });
itemImageFile.addEventListener('change', async(e)=>{ const file=e.target.files[0]; if(!file) return; itemPrev.style.display='block'; itemPrev.src=URL.createObjectURL(file); addItemBtn.innerText='⏳ Uploading...'; addItemBtn.disabled=true; const r=ref(storage,`restaurants/${curUser.uid}/menu_${Date.now()}_${file.name}`); await uploadBytes(r,file); newItemImageUrl=await getDownloadURL(r); addItemBtn.innerText='➕ Add to Menu'; addItemBtn.disabled=false; itemStatus.innerText='✅ Image ready'; });
window.getGPS=()=>{ gpsText.innerText='Getting GPS...'; navigator.geolocation.getCurrentPosition(pos=>{ currentLat=pos.coords.latitude; currentLng=pos.coords.longitude; gpsText.innerText=`📍 ${currentLat.toFixed(6)}, ${currentLng.toFixed(6)}`; }); };
window.saveProfile=async()=>{ const data={ name:pName.value.trim(), phone:pPhone.value.trim(), category:pCategory.value, area:pArea.value.trim(), updatedAt:serverTimestamp() }; if(newLogoUrl) data.logoUrl=newLogoUrl; if(newCoverUrl) data.coverUrl=newCoverUrl; if(currentLat){ data.lat=currentLat; data.lng=currentLng; } await updateDoc(doc(db,'restaurants',curUser.uid), data); saveStatus.innerText='✅ Saved!'; alert('✅ Saved'); };
function listenMyMenu(){ onSnapshot(collection(db,'restaurants',curUser.uid,'menu'),(snap)=>{ let html=''; snap.forEach(d=>{ const it={id:d.id,...d.data()}; html+=`<div class="card" style="display:flex;gap:10px;align-items:center"><img src="${it.imageUrl||''}" style="width:50px;height:50px;border-radius:8px;object-fit:cover;background:#eee"><div style="flex:1"><b>${it.name}</b> <small style="background:#0B4D2E;color:#fff;padding:2px 6px;border-radius:8px;font-size:10px">${it.category||'No cat'}</small><br><small>UGX ${it.price}</small></div><button onclick="deleteMenu('${it.id}')" style="border:none;background:#fee;color:#d33;padding:6px 10px;border-radius:7px">Delete</button></div>`; }); myMenuItems.innerHTML=html||'<div class="card" style="text-align:center;color:#888">No menu yet</div>'; }); }
window.addMenuItem=async()=>{
  if(!itemName.value||!itemPrice.value){ alert('Add name & price'); return; }
  if(!itemCategory.value){ alert('Please select category!'); return; }
  await addDoc(collection(db,'restaurants',curUser.uid,'menu'),{ name:itemName.value.trim(), category:itemCategory.value, price:parseInt(itemPrice.value), description:itemDesc.value.trim(), imageUrl:newItemImageUrl||'', createdAt:serverTimestamp(), available:true });
  itemName.value=''; itemPrice.value=''; itemDesc.value=''; itemCategory.value=''; itemPrev.style.display='none'; newItemImageUrl=null; itemStatus.innerText='✅ Added!';
};
window.deleteMenu=async(id)=>{ if(confirm('Delete item?')) await deleteDoc(doc(db,'restaurants',curUser.uid,'menu',id)); };
window.showTab=(t)=>{
  ordersList.style.display=t==='orders'?'block':'none';
  orderFilter.style.display=t==='orders'?'flex':'none';
  menuList.style.display=t==='menu'?'block':'none';
  profileBox.style.display=t==='profile'?'block':'none';
  document.querySelectorAll('#mainTabs.tab').forEach(b=>b.classList.remove('active'));
  if(t==='orders') oTab.classList.add('active');
  if(t==='menu') mTab.classList.add('active');
  if(t==='profile') pTab.classList.add('active');
};
window.logout=()=>signOut(auth).then(()=>{ location.reload(); });
</script>
</body>
</html>
